openapi: 3.0.3
info:
  title: DWP Finals Portal API Delta
  version: 1.0.0
  description: >-
    Feature 004 contract for anonymous active-game reads. Existing account, game mutation, and
    retrospective contracts remain authoritative in features 001, 002, and 003.
  license:
    name: Private educational project
    url: https://choosealicense.com/no-permission/
servers:
  - url: /
paths:
  /api/games:
    get:
      tags: [Games]
      summary: Browse active games without authentication
      operationId: listPublicGames
      security: []
      parameters:
        - name: search
          in: query
          description: Case-insensitive partial title match.
          schema:
            type: string
        - name: releaseWindow
          in: query
          schema:
            type: string
            enum: [all, new, upcoming]
            default: all
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Bounded page containing only active games.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedGamesResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/games/{gameId}:
    get:
      tags: [Games]
      summary: Get one active game without authentication
      operationId: getPublicGame
      security: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Active game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
components:
  schemas:
    GameResponse:
      type: object
      required:
        - id
        - title
        - releaseDate
        - isActive
        - createdAtUtc
        - updatedAtUtc
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        releaseDate:
          type: string
          format: date
        coverImageUrl:
          type: string
          format: uri
          nullable: true
        isActive:
          type: boolean
          enum: [true]
        createdAtUtc:
          type: string
          format: date-time
        updatedAtUtc:
          type: string
          format: date-time
        archivedAtUtc:
          type: string
          format: date-time
          nullable: true
    PagedGamesResponse:
      type: object
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/GameResponse'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        totalCount:
          type: integer
          minimum: 0
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
      additionalProperties: true
    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
  responses:
    ValidationError:
      description: Query validation failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
    NotFoundError:
      description: The game does not exist or is archived.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
