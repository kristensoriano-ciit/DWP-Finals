openapi: 3.0.3
info:
  title: DWP Finals Games API
  version: 1.0.0
  license:
    name: Private educational project
servers:
  - url: /
paths:
  /api/games:
    get:
      summary: List active games
      operationId: listGames
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: releaseWindow, in: query, schema: { type: string, enum: [all, new, upcoming] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Paged active games }
        '400': { description: Invalid query }
        '401': { description: Authentication required }
    post:
      summary: Create a game
      operationId: createGame
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Game created }
        '400': { description: Invalid game }
        '401': { description: Authentication required }
        '403': { description: Admin role required }
        '409': { description: Duplicate normalized title and release date }
  /api/games/{gameId}:
    parameters:
      - name: gameId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get an active game
      operationId: getGame
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Active game }
        '401': { description: Authentication required }
        '404': { description: Game not found or archived }
    put:
      summary: Update a game
      operationId: updateGame
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Game updated }
        '400': { description: Invalid game }
        '401': { description: Authentication required }
        '403': { description: Admin role required }
        '404': { description: Game not found }
        '409': { description: Duplicate normalized title and release date }
    delete:
      summary: Archive a game
      operationId: archiveGame
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Game archived; repeated requests are idempotent }
        '401': { description: Authentication required }
        '403': { description: Admin role required }
        '404': { description: Game not found }
        '409': { description: Game changed during archival }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
